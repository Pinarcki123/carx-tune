<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#f2f2f7;--cd:#fff;--tx:#1c1c1e;--mu:#8e8e93;--bd:rgba(60,60,67,.16);--a:#0a84ff;--b:#ff9f0a;--sh:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);--r:16px;color-scheme:light}
[data-theme=dark]{--bg:#000;--cd:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--bd:rgba(84,84,88,.6);--a:#64d2ff;--b:#ffb340;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(env(safe-area-inset-bottom) + 96px);transition:background .25s,color .25s}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--bd)}
header h1{font-size:17px;font-weight:600;margin:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
header h1.show,header h1.always{opacity:1}
.saved{font-size:12px;color:var(--mu);min-width:64px;text-align:right}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:.5px solid var(--bd);border-radius:12px;padding:10px 12px;min-height:44px;-webkit-appearance:none;appearance:none;transition:transform .12s,background .2s}
button{cursor:pointer;font-weight:500}button:active{transform:scale(.97)}
button.p{background:var(--a);border-color:var(--a);color:#fff;font-weight:600}
button.ghost{border-color:transparent;background:transparent;color:var(--a);padding-left:4px;padding-right:4px}
button.danger{color:#ff453a}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px}
.large{font-size:34px;font-weight:700;margin:8px 2px 14px;letter-spacing:-.02em}
.card{background:var(--cd);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mu{color:var(--mu)}small{color:var(--mu)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.qs{background:var(--cd);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}
.qs b{display:block;font-size:20px;margin-top:2px}.qs small{font-size:12px}
.hrow{display:flex;gap:10px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.hrow::-webkit-scrollbar{display:none}
.hrow .mini{flex:0 0 150px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:34px;padding:6px 12px;border-radius:999px;font-size:14px;background:var(--cd);border:.5px solid var(--bd)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.grid{grid-template-columns:1fr 1fr 1fr}}
.tile{background:var(--cd);border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .top{display:flex;justify-content:space-between;align-items:center}
.tile .car{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .nm{font-size:14px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .meta{font-size:13px;color:var(--mu)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--a) 15%,transparent);color:var(--a)}
.ring{width:38px;height:38px;flex:0 0 auto}
.ring text{font-size:9px;font-weight:700;fill:var(--tx)}
#ptr{height:0;overflow:hidden;text-align:center;color:var(--mu);font-size:13px;transition:height .2s}
.seg{display:flex;background:color-mix(in srgb,var(--bd) 70%,transparent);border-radius:12px;padding:3px;gap:3px;margin:12px 0}
.seg button{flex:1;border:0;background:transparent;min-height:36px;padding:6px 8px;font-size:14px;box-shadow:none}
.seg button.on{background:var(--cd);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:700px){.summary{grid-template-columns:repeat(4,1fr)}}
.stat{background:color-mix(in srgb,var(--bd) 35%,transparent);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:18px}.stat small{font-size:12px}
label.lbl{display:block;font-size:13px;color:var(--mu);margin:12px 0 6px}
.field{width:100%}
details{background:var(--cd);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
summary{list-style:none;padding:16px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";color:var(--mu);font-size:22px;transform:rotate(90deg);transition:transform .2s}
details[open] summary::after{transform:rotate(270deg)}
.sec{display:grid;grid-template-columns:1fr;gap:16px;padding:0 16px 18px}
@media(min-width:900px){.sec{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.sec .cg{position:sticky;top:76px}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 0 12px 10px;border-top:.5px solid var(--bd);border-left:4px solid transparent}
.row:first-child{border-top:0}
.row label{flex:1 1 140px;font-size:15px;line-height:1.3}
.in{display:flex;align-items:center;gap:6px;flex:1 1 220px;justify-content:flex-end}
.in input,.in select{flex:0 0 auto;width:118px;min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
.in .fr-l{font-size:12px;color:var(--mu);margin-left:4px}
.in span{font-size:12px;color:var(--mu);min-width:12px;text-align:center}
.unit{font-size:12px;color:var(--mu);margin-left:4px;white-space:nowrap}
h3{margin:18px 0 6px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.cg{display:flex;flex-direction:column;gap:12px;align-content:start}
.cc{background:var(--cd);border:.5px solid var(--bd);border-radius:14px;padding:12px;position:relative}
.cc h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--mu)}
.cv{opacity:0;transition:opacity .3s}.cv.ready{opacity:1}
.shim{position:absolute;inset:12px;border-radius:10px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--bd) 80%,transparent),transparent);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.cc.small .wrapc{height:120px}.cc.big .wrapc{height:240px}.cc.tall .wrapc{height:300px}
.wrapc{position:relative}
.tabbar{display:none}
@media(max-width:899px){
 .tabbar{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;background:color-mix(in srgb,var(--cd) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.18),0 0 0 .5px var(--bd);padding:6px;gap:2px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
 .tabbar::-webkit-scrollbar{display:none}
 .tabbar button{flex:0 0 auto;min-width:58px;border:0;background:transparent;color:var(--mu);font-size:11px;padding:6px 6px;min-height:50px;box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:18px}
 .tabbar button i{font-style:normal;font-size:18px;line-height:1}
 .tabbar button.on{color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent);font-weight:600}
}
#md{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fadeBg .2s}
@keyframes fadeBg{from{opacity:0}}
#md .sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--cd);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .28s ease}
@media(min-width:900px){#md{align-items:center}#md .sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.hist{border-top:.5px solid var(--bd);padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
textarea{width:100%;min-height:90px;font:12px ui-monospace,monospace}
#toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(10px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:22px;opacity:0;transition:.25s;pointer-events:none;z-index:50;font-size:14px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast button{pointer-events:auto}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<nav class="tabbar" id="tabs"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" crossorigin="anonymous"></script>
<script>
// ================= CONSTANTS =================
const T=['Stock','Street','Sport','Racing','Elite','Ultimate'];
const TC=['transparent','#8e8e93','#34c759','#ff453a','#ffd60a','#bf5af2'];
const STG=['Stock','Stage 1','Stage 2','Stage 3','Stage 4'];
const CLASSES=['C1','C2','C3','C4','C5','C6','CS','CS+'];
const CCOL={'C1':'#0a84ff','C2':'#30b0c7','C3':'#34c759','C4':'#ffd60a','C5':'#ff9f0a','C6':'#ff6b35','CS':'#ff375f','CS+':'#ff453a'};
const TAGS=['drift','drag','grip','circuit'];
const SNAP_GAP=10*60*1000, SNAP_MAX=20;
// Fixed, broad reference ranges for the radar (edit here). weight: inv=true means lighter scores higher.
// Acceleration is a CarX game value; the 0-100 range is a placeholder until you confirm it.
const RANGES={wt:{min:800,max:2200,inv:true},hp:{min:100,max:1200},top:{min:150,max:450},acc:{min:0,max:100}};

// ================= FIELDS =================
const N=(k,l,u,x={})=>({k,l,u,t:'n',...x});
const FR=(k,l,u,x={})=>({k,l,u,t:'fr',...x});
const S=(k,l,o,x={})=>({k,l,o,t:'s',...x});
const SFR=(k,l,o,x={})=>({k,l,o,t:'sfr',...x});
const X=(k,l)=>({k,l,t:'x'});
const elite=d=>['Elite','Ultimate'].includes(d['p:Differential']);
const dmp=d=>['Front dampers','Rear dampers'].some(p=>['Sport','Racing','Elite','Ultimate'].includes(d['p:'+p]));
const pro=d=>['poF','poR'].some(k=>['Racing','Stretch'].includes(d[k]));
const drvF=d=>elite(d)&&['AWD','FWD'].includes(d.dr);
const drvR=d=>elite(d)&&['AWD','RWD'].includes(d.dr);
const drvAny=d=>drvF(d)||drvR(d);
const SEC=[
{id:'stats',t:'Car overall stats',f:[N('wt','Weight','kg'),N('hp','Power','hp'),N('top','Top speed','speed'),S('su','Speed unit',['km/h','mph']),N('acc','Acceleration','game value'),N('nos','Nitrous charge','game value')]},
{id:'eng',t:'Engine',f:[X('en','Engine name'),S('et','Engine tier',T),N('ew','Weight','kg'),N('ed','Durability','game value'),N('tl','Torque low','Nm'),N('tm','Torque medium','Nm'),N('th','Torque high','Nm'),N('rev','Rev limiter','RPM'),S('tb','Turbine',['No','Yes']),N('tp','Turbine pressure','bar',{show:d=>d.tb==='Yes'}),N('pk','Peak RPM','RPM'),N('ei','Engine inertia ratio','game value')],
 p:['ECU','Turbo kit','Camshaft','Intake manifold','Nitro','Fuel system','Cylinder head','Engine block','Exhaust manifold','Exhaust']},
{id:'drive',t:'Drivetrain',f:[X('tn','Transmission name'),S('tt2','Transmission tier',T),N('dw','Weight','kg'),N('dd','Durability','game value'),S('dr','Drive',['AWD','RWD','FWD']),N('dl','Drivetrain loss','%'),N('gs','Gear shifting speed','s'),N('ng','Number of gears','',{int:1}),N('fd','Final drive','game value'),{k:'g',t:'g',l:'Gear ratios'},N('lk','Differential locking','%'),
 FR('la','Lock acceleration','coef.',{show:drvAny,front:drvF,rear:drvR}),FR('ld','Lock deceleration','coef.',{show:drvAny,front:drvF,rear:drvR}),FR('pl','Preload','Nm',{show:drvAny,front:drvF,rear:drvR})],
 p:['Clutch','Differential','Transmission']},
{id:'body',t:'Body',f:[N('bw','Weight','kg'),N('cm','Center of mass height','game value'),N('bd','Durability','game value'),N('ar','Air resistance','game value',{neg:1}),FR('df','Downforce','kg'),N('wd','Weight distribution','%'),N('gt','Gas tank','liters')],
 p:['Weight reduction','Gas tank','Front aero','Rear aero',['Body stage',STG]]},
{id:'susp',t:'Suspension',f:[N('sw','Weight','kg'),N('sd','Durability','game value'),FR('sh','Spring height','mm',{neg:1}),FR('ss','Spring stiffness','kNm'),FR('st','Stabilizer stiffness','kNm'),FR('cb','Camber','deg',{neg:1}),N('cs','Caster angle','deg',{neg:1}),N('ak','Ackermann angle','deg',{neg:1}),N('sa','Steering angle','deg',{neg:1}),N('bf','Braking force','kNm'),N('bb','Front brake balance','%'),
 FR('d1','Damper slow bump','game value',{show:dmp}),FR('d2','Damper fast bump','game value',{show:dmp}),FR('d3','Damper slow rebound','game value',{show:dmp}),FR('d4','Damper fast rebound','game value',{show:dmp})],
 p:['Front arms','Rear arms','Front anti-roll bar','Rear anti-roll bar','Brake system','Front springs','Rear springs','Front dampers','Rear dampers']},
{id:'whl',t:'Wheels',f:[N('wu','Durability','game value'),FR('ww','Width','mm'),FR('wp','Profile','mm'),SFR('po','Profile option',['None','Racing','Stretch']),SFR('pf','Profile offset',['-10','-5','0','+5','+10'],{show:pro}),FR('rd','Rim diameter','in'),FR('wg','Grip','%'),FR('wo','Wheel offset','cm',{neg:1}),FR('tpr','Tire pressure','bar'),S('tt','Tire type',['Street','Street+','Sport','Sport+','Racing','Racing+'])],
 p:['Spacers front','Spacers rear']}
];
const partF=p=>typeof p==='string'?{k:'p:'+p,l:p,t:'s',o:T}:{k:'p:'+p[0],l:p[0],t:'s',o:p[1]};
const REG={cls:{t:'s',o:CLASSES}};
SEC.forEach(s=>{
 s.f.forEach(f=>{
  if(f.t==='n')REG[f.k]={t:'n'};
  else if(f.t==='fr'){REG[f.k+'F']={t:'n'};REG[f.k+'R']={t:'n'}}
  else if(f.t==='s')REG[f.k]={t:'s',o:f.o};
  else if(f.t==='sfr'){REG[f.k+'F']={t:'s',o:f.o};REG[f.k+'R']={t:'s',o:f.o}}
  else if(f.t==='x')REG[f.k]={t:'x'};
  else if(f.t==='g')for(let i=1;i<=10;i++)REG['g'+i]={t:'n'};
 });
 (s.p||[]).forEach(p=>{const f=partF(p);REG[f.k]={t:'s',o:f.o}});
});

// ================= HELPERS =================
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>typeof v==='number'&&isFinite(v);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
// Power-to-weight in hp per tonne
const pwOf=d=>(num(d.hp)&&num(d.wt)&&d.wt>0)?d.hp/(d.wt/1000):null;
const topKmh=d=>num(d.top)?(d.su==='mph'?d.top*1.609344:d.top):null;
const clsOf=t=>CLASSES.includes(t.cls)?t.cls:'C1';

// ================= INPUTS =================
const numIn=(k,v,neg)=>neg
 ?`<input type=text inputmode=decimal pattern="-?[0-9]*[.]?[0-9]*" data-k="${k}" data-neg=1 value="${E(v??'')}" placeholder="—">`
 :`<input type=number step=any inputmode=decimal min=0 data-k="${k}" value="${E(v??'')}" placeholder="—">`;
const selIn=(k,o,v)=>`<select data-k="${k}">${o.map(x=>`<option${x===(v??o[0])?' selected':''}>${E(x)}</option>`).join('')}</select>`;
function fld(f,d){
 if(f.show&&!f.show(d))return'';
 const u=f.u?`<span class=unit>${E(f.u)}</span>`:'';
 let c='';
 if(f.t==='n')c=numIn(f.k,d[f.k],f.neg)+u;
 else if(f.t==='fr'){
  const fOn=f.front?f.front(d):true,rOn=f.rear?f.rear(d):true;
  c=(fOn?`<span>F</span>${numIn(f.k+'F',d[f.k+'F'],f.neg)}`:'')+(rOn?`<span>R</span>${numIn(f.k+'R',d[f.k+'R'],f.neg)}`:'');
  if(!c)return'';
  c+=u;
 }
 else if(f.t==='s')c=selIn(f.k,f.o,d[f.k])+u;
 else if(f.t==='sfr')c=`<span>F</span>${selIn(f.k+'F',f.o,d[f.k+'F'])}<span>R</span>${selIn(f.k+'R',f.o,d[f.k+'R'])}`;
 else if(f.t==='x')c=`<input type=text data-k="${f.k}" data-txt=1 maxlength=60 value="${E(d[f.k]||'')}" style="width:100%;text-align:left">`;
 else if(f.t==='g'){const n=Math.min(10,Math.max(0,d.ng|0));c=n?Array.from({length:n},(_,i)=>`<span>${i+1}</span>${numIn('g'+(i+1),d['g'+(i+1)])}`).join(''):'<small>Set number of gears first</small>'}
 return`<div class=row><label>${E(f.l)}</label><div class=in>${c}</div></div>`;
}
function partRow(p,d){const f=partF(p);const v=d[f.k]||'Stock';const col=TC[Math.max(0,T.indexOf(v))];
 return`<div class=row style="border-left-color:${col}"><label>${E(f.l)}</label><div class=in>${selIn(f.k,f.o,v)}</div></div>`}

// ================= COMPLETION =================
function filled(s,d){
 let n=0,t=0;
 s.f.forEach(f=>{if(f.show&&!f.show(d))return;
  if(f.t==='n'){t++;if(num(d[f.k]))n++}
  else if(f.t==='fr'){t+=2;if(num(d[f.k+'F']))n++;if(num(d[f.k+'R']))n++}
  else if(f.t==='x'){t++;if(d[f.k])n++}
  else if(f.t==='s'){t++;if(d[f.k]!=null)n++}
  else if(f.t==='sfr'){t+=2;if(d[f.k+'F'])n++;if(d[f.k+'R'])n++}
  else if(f.t==='g'){const k=Math.min(10,d.ng|0);t+=k;for(let i=1;i<=k;i++)if(num(d['g'+i]))n++}
 });
 (s.p||[]).forEach(p=>{t++;if(d[partF(p).k])n++});
 return{n,t};
}
function completion(d){let n=0,t=0;SEC.forEach(s=>{const b=filled(s,d);n+=b.n;t+=b.t});return t?n/t:0}
function ringSvg(pct){const c=2*Math.PI*16;return`<svg class=ring viewBox="0 0 38 38"><circle cx=19 cy=19 r=16 fill=none stroke="color-mix(in srgb,var(--bd) 90%,transparent)" stroke-width=4></circle><circle cx=19 cy=19 r=16 fill=none stroke="var(--a)" stroke-width=4 stroke-linecap=round stroke-dasharray="${(pct*c).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 19 19)"></circle><text x=19 y=22 text-anchor=middle>${Math.round(pct*100)}%</text></svg>`}

// ================= IMPORT / EXPORT =================
function clean(t){
 if(!t||typeof t!=='object'||!t.d||typeof t.d!=='object'||Array.isArray(t.d))return null;
 const d={};
 for(const k of Object.keys(t.d)){
  const r=REG[k],v=t.d[k];if(!r)continue;
  if(r.t==='n'&&num(v))d[k]=v;
  else if(r.t==='s'&&r.o.includes(v))d[k]=v;
  else if(r.t==='x'&&typeof v==='string')d[k]=v.slice(0,60);
 }
 const tags=Array.isArray(t.tags)?t.tags.filter(x=>TAGS.includes(x)):[];
 return{id:uid(),name:String(t.name||'Imported tune').slice(0,80),car:String(t.car||'').slice(0,80),cls:CLASSES.includes(t.cls)?t.cls:'C1',tags,d,up:Date.now(),hist:[]};
}
const enc=o=>btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

function flat(t){

 SEC.forEach(s=>s.f.forEach(f=>{
  if(f.show&&!f.show(t.d))return;
  const L=s.t+' · '+f.l;
  if(f.t==='n')m.set(L,{u:f.u||'',v:t.d[f.k]});

  else if(f.t==='g')for(let i=1;i<=10;i++)if(num(t.d['g'+i]))m.set('Gear '+i,{u:'ratio',v:t.d['g'+i]});
 }));

}

function destroyCharts(){charts.forEach(c=>c.destroy());charts=[]}
function palette(){const cs=getComputedStyle(document.documentElement);return{a:cs.getPropertyValue('--a').trim(),b:cs.getPropertyValue('--b').trim(),tx:cs.getPropertyValue('--tx').trim(),bd:cs.getPropertyValue('--bd').trim()}}
function baseOpts(title,p){
 Chart.defaults.color=p.tx;Chart.defaults.borderColor=p.bd;Chart.defaults.font.family='-apple-system,system-ui,sans-serif';
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 return{responsive:true,maintainAspectRatio:false,animation:{duration:reduce?0:400},plugins:{title:{display:!!title,text:title,color:p.tx,font:{size:12,weight:'600'}},legend:{display:false}}}}
// Card holding one chart: shimmer while it draws, then fade in
function card(parent,title,size){
 const w=document.createElement('div');w.className=`cc ${size||'small'}`;
 if(title)w.innerHTML=`<h4>${E(title)}</h4>`;
 const wr=document.createElement('div');wr.className='wrapc';
 const sh=document.createElement('div');sh.className='shim';
 const cv=document.createElement('canvas');cv.className='cv';
 wr.append(sh,cv);w.append(wr);parent.append(w);return cv;
}
// One chart per item: front/rear pairs show two bars, single values one bar
function chartItem(parent,label,unit,vals,p){
 const valid=vals.map(v=>num(v)?v:null);if(valid.every(v=>v==null))return;
 const pair=vals.length===2;
 const cv=card(parent,label+(unit?` (${unit})`:''),'small');
 charts.push(new Chart(cv,{type:'bar',data:{labels:pair?['Front','Rear']:[label],datasets:[{data:valid,backgroundColor:pair?[p.a,p.b]:[p.a],borderRadius:6,maxBarThickness:48}]},
  options:{...baseOpts('',p),scales:{y:{grid:{color:ctx=>ctx.tick.value===0?p.tx:undefined},title:{display:false}}}}}));
}
function chartTorque(parent,d,p){
 const pts=[['Low',d.tl],['Medium',d.tm],['High',d.th]];if(!pts.some(x=>num(x[1])))return;
 const vals=pts.map(x=>num(x[1])?x[1]:null);const mx=Math.max(...vals.filter(num));const pk=vals.indexOf(mx);
 const cv=card(parent,'Torque curve (peak in gold)','big');
 charts.push(new Chart(cv,{type:'line',data:{labels:pts.map(x=>x[0]),datasets:[{label:'Nm',data:vals,borderColor:p.a,backgroundColor:p.a+'22',fill:true,tension:.35,pointRadius:vals.map((_,i)=>i===pk?8:4),pointBackgroundColor:vals.map((_,i)=>i===pk?'#ffd60a':p.a)}]},
  options:{...baseOpts('',p),scales:{y:{title:{display:true,text:'Nm'}}}}}));
}
function chartGears(parent,d,p){
 const n=Math.min(10,Math.max(0,d.ng|0));const v=Array.from({length:n},(_,i)=>d['g'+(i+1)]);if(!v.some(num))return;
 const labels=v.map((_,i)=>'G'+(i+1));
 const gaps=v.slice(1).map((x,i)=>num(x)&&num(v[i])?v[i]-x:null);
 const valid=gaps.filter(num).map(Math.abs);const avg=valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:0;
 const pc=v.map((_,i)=>i===0?p.a:(num(gaps[i-1])&&Math.abs(gaps[i-1])>avg*1.5?'#ff453a':p.a));
 const cv=card(parent,'Gear ratios (red = wide gap to next gear)','big');
 charts.push(new Chart(cv,{type:'line',data:{labels,datasets:[{label:'Ratio',data:v,borderColor:p.a,tension:0,spanGaps:true,pointRadius:6,pointBackgroundColor:pc}]},
  options:{...baseOpts('',p),scales:{y:{title:{display:true,text:'Ratio'}}}}}));
}
// Radar: fixed ranges from RANGES, so the shape means the same thing for every tune
function radarScore(key,val){
 const r=RANGES[key];if(!num(val))return null;
 let s=clamp((val-r.min)/(r.max-r.min),0,1)*100;
 return r.inv?100-s:s;
}
function chartRadar(parent,d,p){
 const axes=[['Weight (light = high)',radarScore('wt',d.wt)],['Power',radarScore('hp',d.hp)],['Top speed',radarScore('top',topKmh(d))],['Acceleration',radarScore('acc',d.acc)]];
 if(axes.every(a=>a[1]==null))return;
 const cv=card(parent,'Car profile (fixed scale, 0–100)','big');
 charts.push(new Chart(cv,{type:'radar',data:{labels:axes.map(a=>a[0]),datasets:[{label:'This tune',data:axes.map(a=>a[1]==null?null:Math.round(a[1])),borderColor:p.a,backgroundColor:p.a+'33',pointBackgroundColor:p.a,spanGaps:true}]},
  options:{...baseOpts('',p),plugins:{...baseOpts('',p).plugins,legend:{display:true,labels:{color:p.tx}}},scales:{r:{beginAtZero:true,max:100,ticks:{display:false,stepSize:25},grid:{color:p.bd},angleLines:{color:p.bd},pointLabels:{color:p.tx}}}}}));
}
function drawCharts(){
 destroyCharts();
 if(!window.Chart){document.querySelectorAll('.cg,#cb').forEach(e=>e.innerHTML='<div class=card><p class=mu>Charts need Chart.js. Open the app once while online.</p></div>');return}
 const p=palette();
 if(view==='edit'){
  const d=cur.d;
  const st=$('c-stats');if(st)chartRadar(st,d,p);
  const eng=$('c-eng');if(eng){chartTorque(eng,d,p);}
  const dr=$('c-drive');if(dr){chartGears(dr,d,p)}
  // one chart per item for every other numeric field and front/rear pair
  SEC.forEach(s=>{
   const box=$('c-'+s.id);if(!box)return;
   s.f.forEach(f=>{
    if(f.show&&!f.show(d))return;
    if(f.t==='n'){
     if(['tl','tm','th','gs'].includes(f.k)&&s.id==='eng')return; // torque is one curve
     chartItem(box,f.l,f.u,[d[f.k]],p);
    }
    else if(f.t==='fr'){
     const vals=[d[f.k+'F'],d[f.k+'R']];
     if(f.front&&!f.front(d))vals[0]=null;if(f.rear&&!f.rear(d))vals[1]=null;
     chartItem(box,f.l,f.u,vals,p);
    }
   });
  });
  // Stats: single values as their own charts (weight, power, top speed, acceleration, nitrous)
  // (already covered by the generic loop above)
  setTimeout(()=>{document.querySelectorAll('.cv').forEach(c=>c.classList.add('ready'));document.querySelectorAll('.shim').forEach(s=>s.remove())},250);
 } else if(view==='cmp'){
  const a=find(cA),b=find(cB),box=$('cb');
  if(a&&b&&box){
   const rows=compareRows(a,b);
   if(!rows.length){box.innerHTML='<div class=card><p class=mu>Nothing to compare yet. Fill in values for either tune.</p></div>'}
   rows.forEach(r=>{
    const cv=card(box,`${r.label}${r.unit?' ('+r.unit+')':''}`,'small');
    charts.push(new Chart(cv,{type:'bar',data:{labels:[a.name,b.name],datasets:[{data:[r.a,r.b],backgroundColor:[p.a,p.b],borderRadius:6,maxBarThickness:48}]},options:baseOpts('',p)}));
   });
   setTimeout(()=>{document.querySelectorAll('.cv').forEach(c=>c.classList.add('ready'));document.querySelectorAll('.shim').forEach(s=>s.remove())},250);
  }
 }
}

document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='q'){q=el.value;$('lst').innerHTML=sortTunes(DB.tunes.filter(tuneMatches)).map(tileHtml).join('')||'<p class=mu style="grid-column:1/-1">No tunes match these filters.</p>';return}
 if(!cur)return;
 if(el.dataset.r){
  snapshot(cur);
  cur[el.dataset.r]=el.value;cur.up=Date.now();save();
  if(el.dataset.r==='name'){const h=$('ttl');if(h)h.textContent=el.value||'Tune'}
  return}
 if(el.dataset.txt){snapshot(cur);cur.d[el.dataset.k]=el.value;cur.up=Date.now();save();return}
 if(el.dataset.k){snapshot(cur);setv(el);const b=$('sumbox');if(b)b.outerHTML=summaryHtml(cur)}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.c){if(el.dataset.c==='a')cA=el.value;else cB=el.value;drawCharts();return}
 if(el.id==='fi'){el.files[0]&&el.files[0].text().then(t=>addTunes(parse(t)));return}
 if(!cur)return;
 if(el.dataset.r==='cls'){snapshot(cur);cur.cls=el.value;cur.up=Date.now();save();renderEdit();return}
 if(el.dataset.r)return;
 if(!el.dataset.k)return;
 snapshot(cur);setv(el);
 if(el.tagName==='SELECT'||el.dataset.int){const sc=scrollY;renderEdit();scrollTo(0,sc)}
 else drawCharts();
});
document.addEventListener('focusout',e=>{
 const el=e.target;
 if(el.dataset&&el.dataset.neg&&cur&&(el.value==='-'||el.value==='.'||el.value==='-.')){el.value='';setv(el)}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.k){const all=[...document.querySelectorAll('[data-k]')];const i=all.indexOf(e.target);if(i>-1&&all[i+1]){e.preventDefault();all[i+1].focus()}}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'&&view==='list'){e.preventDefault();document.querySelector('[data-a=new]')?.click()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'&&view==='list'){e.preventDefault();$('q')?.focus()}
});
document.addEventListener('toggle',e=>{const s=e.target.dataset&&e.target.dataset.s;if(s){e.target.open?open.add(s):open.delete(s)}},true);
window.addEventListener('resize',()=>{if(view==='edit')applyMode()});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,id=b.dataset.id;
 if(a==='theme'){th=th==='dark'?'light':'dark';ls.set('cxth',th);applyTheme();view==='edit'?renderEdit():view==='cmp'?renderCmp():renderList()}
 else if(a==='new'){cur={id:uid(),name:'New tune',car:'',cls:'C1',tags:[],d:{},up:Date.now(),hist:[]};DB.tunes.unshift(cur);touchRecent(cur.id);save();renderEdit();const n=document.querySelector('[data-r=name]');if(n){n.focus();n.select()}}
 else if(a==='open'){cur=find(id);if(cur){touchRecent(id);save();renderEdit()}}
 else if(a==='back'){cur=null;renderList()}
 else if(a==='mode'){mode=b.dataset.m;applyMode()}
 else if(a==='jump'){const det=$('sec-'+b.dataset.s);if(det){det.open=true;open.add(b.dataset.s);det.scrollIntoView({behavior:'smooth',block:'start'})}}
 else if(a==='filter'){const g=b.dataset.g;filt[g]=b.dataset.v;renderList()}
 else if(a==='tag'){snapshot(cur);const x=b.dataset.tag;cur.tags=cur.tags||[];cur.tags=cur.tags.includes(x)?cur.tags.filter(t=>t!==x):[...cur.tags,x];cur.up=Date.now();save();renderEdit()}
 else if(a==='dup'){const t=find(id),c=JSON.parse(JSON.stringify(t));c.id=uid();c.name+=' (copy)';c.hist=[];c.up=Date.now();DB.tunes.unshift(c);save();renderList()}
 else if(a==='del'){const t=find(id);if(!confirm(`Delete "${t.name}"? This cannot be undone.`))return;
  const idx=DB.tunes.indexOf(t);DB.tunes.splice(idx,1);DB.recent=DB.recent.filter(x=>x!==id);save();
  undo={t,idx};toast('Tune deleted',{a:'undo',l:'Undo'});renderList()}
 else if(a==='undo'){if(undo){DB.tunes.splice(Math.min(undo.idx,DB.tunes.length),0,undo.t);save();undo=null;toast('Restored');renderList()}}
 else if(a==='prune'){DB.tunes.forEach(t=>{t.hist=(t.hist||[]).slice(0,3)});save();toast('Old snapshots cleared')}
 else if(a==='compare')renderCmp();
 else if(a==='close'){const m=$('md');if(m)m.remove()}
 else if(a==='history'){
  const hs=cur.hist||[];
  modal(`<b>Setup history</b><p class=mu style="font-size:13px">Saved automatically about every 10 minutes while you edit. Restoring first saves the current version, so you can undo a restore.</p>${hs.length?hs.map((h,i)=>`<div class=hist><div><b>${new Date(h.t).toLocaleString()}</b><br><small>${E(h.name)} · ${E(h.car)} · ${E(h.cls||'')} · ${pwOf(h.d)!=null?pwOf(h.d).toFixed(0)+' hp/t':'no power data'}</small></div><button data-a=restore data-i=${i}>Restore</button></div>`).join(''):'<p class=mu>No snapshots yet. Make a change and they will appear here.</p>'}`);
 }
 else if(a==='restore'){const h=(cur.hist||[])[+b.dataset.i];if(!h)return;
  snapshot(cur,true);
  cur.name=h.name;cur.car=h.car;cur.cls=h.cls||'C1';cur.tags=[...(h.tags||[])];cur.d=JSON.parse(JSON.stringify(h.d));cur.up=Date.now();save();
  const m=$('md');if(m)m.remove();toast('Restored. Previous version saved.');renderEdit()}
 else if(a==='share'){
  const t=find(id),c=enc(strip(t)),l=location.href.split('#')[0]+'#t='+c;
  modal(`<b>Share "${E(t.name)}"</b><p class=mu>Link (tap to import):</p><textarea id=sl readonly>${E(l)}</textarea><div class=acts><button data-a=copy data-id=sl>Copy link</button></div><p class=mu>Code (paste into Import):</p><textarea id=sc readonly>${E(c)}</textarea><div class=acts><button data-a=copy data-id=sc>Copy code</button><button data-a=file data-id=${t.id}>Download .json</button></div>`);
 }
 else if(a==='copy'){const el=$(id);el.select();(navigator.clipboard?navigator.clipboard.writeText(el.value):Promise.reject()).catch(()=>document.execCommand('copy'));toast('Copied')}
 else if(a==='file'||a==='backup'){
  const o=a==='file'?strip(find(id)):{v:2,tunes:DB.tunes.map(strip)};
  const n=a==='file'?find(id).name.replace(/\W+/g,'-'):'carx-backup-'+new Date().toISOString().slice(0,10);
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));l.download=n+'.json';document.body.append(l);l.click();l.remove();
 }
 else if(a==='import')modal('<b>Import</b><p class=mu>Paste a tune code or link:</p><textarea id=ic></textarea><div class=acts><button class=p data-a=doimport>Import</button></div><p class=mu>Or choose a .json tune or backup file:</p><input type=file id=fi accept=".json,.txt,application/json">');
 else if(a==='doimport')addTunes(parse($('ic').value));
});
applyTheme();renderList();
if(location.hash.startsWith('#t=')){modal('<b>Import</b><p class=mu>A shared tune was opened:</p><textarea id=ic>'+E(location.hash)+'</textarea><div class=acts><button class=p data-a=doimport>Import it</button></div>')}
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
