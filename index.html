<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CarX Tune Database</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CarX Tunes">
<style>
:root{--bg:#f2f2f7;--cd:#ffffff;--tx:#1c1c1e;--mu:#8e8e93;--bd:rgba(60,60,67,.18);--ac:#0a84ff;--good:#34c759;--bad:#ff453a;--sh:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);--r:14px;color-scheme:light}
[data-theme=dark]{--bg:#000000;--cd:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--bd:rgba(84,84,88,.65);--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(env(safe-area-inset-bottom) + 64px);transition:background .25s,color .25s}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--cd) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--bd)}
header h1{font-size:17px;font-weight:600;margin:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:12px;color:var(--mu);min-width:56px;text-align:right;transition:opacity .3s}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:.5px solid var(--bd);border-radius:10px;padding:9px 12px;min-height:44px;-webkit-appearance:none;appearance:none;transition:transform .12s,background .2s}
button{cursor:pointer;font-weight:500}button:active{transform:scale(.97)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.ghost{border-color:transparent;background:transparent;color:var(--ac);padding-left:4px;padding-right:4px}
button.danger{color:var(--bad)}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.card{background:var(--cd);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:14px;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.seg{display:flex;background:color-mix(in srgb,var(--bd) 60%,transparent);border-radius:10px;padding:2px;gap:2px;margin:10px 0}
.seg button{flex:1;border:0;background:transparent;min-height:34px;padding:6px 8px;font-size:14px;box-shadow:none}
.seg button.on{background:var(--cd);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.summary{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1 1 90px;background:color-mix(in srgb,var(--bd) 35%,transparent);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:18px}.stat small{color:var(--mu);font-size:12px}
details{background:var(--cd);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
summary{list-style:none;padding:14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";color:var(--mu);font-size:22px;transform:rotate(90deg);transition:transform .2s}
details[open] summary::after{transform:rotate(270deg)}
.badge{font-size:12px;font-weight:500;color:var(--mu);margin-left:auto;margin-right:10px}
.sec{display:grid;grid-template-columns:1fr;gap:12px;padding:0 14px 14px}
@media(min-width:900px){.sec{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.sec .cg{position:sticky;top:76px}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-top:.5px solid var(--bd);border-left:4px solid transparent;padding-left:10px}
.row:first-child{border-top:0}
.row label{flex:1 1 140px;font-size:15px}
.in{display:flex;align-items:center;gap:6px;flex:1 1 180px}
.in input,.in select{flex:1;min-width:0;width:100%;text-align:right}
.in span{font-size:12px;color:var(--mu);min-width:12px;text-align:center}
.unit{font-size:12px;color:var(--mu);margin-left:4px}
small,.mu{color:var(--mu)}
h3{margin:14px 0 4px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.cg{display:flex;flex-direction:column;gap:10px;align-content:start}
.ch{position:relative;height:220px}.ch.tall{height:280px}
.cc{background:var(--cd);border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.field{width:100%}
label.lbl{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
.tabbar{display:none}
@media(max-width:899px){.tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:25;background:color-mix(in srgb,var(--cd) 85%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;gap:4px}
.tabbar button{flex:0 0 auto;min-width:68px;border:0;background:transparent;font-size:12px;color:var(--mu);padding:6px 8px;min-height:44px;box-shadow:none}
.tabbar button.on{color:var(--ac);font-weight:600}}
#md{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fadeBg .2s}
@keyframes fadeBg{from{opacity:0}}
#md .sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--cd);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .28s ease}
@media(min-width:900px){#md{align-items:center}#md .sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
textarea{width:100%;min-height:90px;font:12px ui-monospace,monospace}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(10px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:50;font-size:14px;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
.tc{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tunehead{display:flex;flex-wrap:wrap;gap:6px}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<nav class="tabbar" id="tabs"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" crossorigin="anonymous"></script>
<script>
const T=['Stock','Street','Sport','Racing','Elite','Ultimate'];
const TC=['transparent','#8e8e93','#34c759','#ff453a','#ffd60a','#bf5af2'];
const STG=['Stock','Stage 1','Stage 2','Stage 3','Stage 4'];
const C={a:'#0a84ff',b:'#ff9f0a',front:'#0a84ff',rear:'#ff375f',good:'#34c759',bad:'#ff453a',gold:'#ffd60a'};

// ---- field definitions ----
const N=(k,l,u,x={})=>({k,l,u,t:'n',...x});
const FR=(k,l,u,x={})=>({k,l,u,t:'fr',...x});
const S=(k,l,o,x={})=>({k,l,o,t:'s',...x});
const SFR=(k,l,o,x={})=>({k,l,o,t:'sfr',...x});
const X=(k,l)=>({k,l,t:'x'});
const elite=d=>['Elite','Ultimate'].includes(d['p:Differential']);
const dmp=d=>['Front dampers','Rear dampers'].some(p=>['Sport','Racing','Elite','Ultimate'].includes(d['p:'+p]));
const pro=d=>['poF','poR'].some(k=>['Racing','Stretch'].includes(d[k]));
const drvF=d=>elite(d)&&['AWD','FWD'].includes(d.dr);
const drvR=d=>elite(d)&&['AWD','RWD'].includes(d.dr);
const drvAny=d=>drvF(d)||drvR(d);
const SEC=[
{id:'stats',t:'Car overall stats',f:[N('wt','Weight','kg'),N('hp','Power','hp'),N('top','Top speed','speed'),S('su','Speed unit',['km/h','mph']),N('acc','Acceleration','game value'),N('nos','Nitrous charge','game value')]},
{id:'eng',t:'Engine',f:[X('en','Engine name'),S('et','Engine tier',T),N('ew','Weight','kg'),N('ed','Durability','game value'),N('tl','Torque low','Nm'),N('tm','Torque medium','Nm'),N('th','Torque high','Nm'),N('rev','Rev limiter','RPM'),S('tb','Turbine',['No','Yes']),N('tp','Turbine pressure','bar',{show:d=>d.tb==='Yes'}),N('pk','Peak RPM','RPM'),N('ei','Engine inertia ratio','game value')],
 p:['ECU','Turbo kit','Camshaft','Intake manifold','Nitro','Fuel system','Cylinder head','Engine block','Exhaust manifold','Exhaust']},
{id:'drive',t:'Drivetrain',f:[X('tn','Transmission name'),S('tt2','Transmission tier',T),N('dw','Weight','kg'),N('dd','Durability','game value'),S('dr','Drive',['AWD','RWD','FWD']),N('dl','Drivetrain loss','%'),N('gs','Gear shifting speed','s'),N('ng','Number of gears','',{int:1}),N('fd','Final drive','game value'),{k:'g',t:'g',l:'Gear ratios'},N('lk','Differential locking','%'),
 FR('la','Lock acceleration','coef.',{show:drvAny,front:drvF,rear:drvR}),FR('ld','Lock deceleration','coef.',{show:drvAny,front:drvF,rear:drvR}),FR('pl','Preload','Nm',{show:drvAny,front:drvF,rear:drvR})],
 p:['Clutch','Differential','Transmission']},
{id:'body',t:'Body',f:[N('bw','Weight','kg'),N('cm','Center of mass height','game value'),N('bd','Durability','game value'),N('ar','Air resistance','game value',{neg:1}),FR('df','Downforce','kg'),N('wd','Weight distribution','%'),N('gt','Gas tank','liters')],
 p:['Weight reduction','Gas tank','Front aero','Rear aero',['Body stage',STG]]},
{id:'susp',t:'Suspension',f:[N('sw','Weight','kg'),N('sd','Durability','game value'),FR('sh','Spring height','mm',{neg:1}),FR('ss','Spring stiffness','kNm'),FR('st','Stabilizer stiffness','kNm'),FR('cb','Camber','deg',{neg:1}),N('cs','Caster angle','deg',{neg:1}),N('ak','Ackermann angle','deg',{neg:1}),N('sa','Steering angle','deg',{neg:1}),N('bf','Braking force','kNm'),N('bb','Front brake balance','%'),
 FR('d1','Damper slow bump','game value',{show:dmp}),FR('d2','Damper fast bump','game value',{show:dmp}),FR('d3','Damper slow rebound','game value',{show:dmp}),FR('d4','Damper fast rebound','game value',{show:dmp})],
 p:['Front arms','Rear arms','Front anti-roll bar','Rear anti-roll bar','Brake system','Front springs','Rear springs','Front dampers','Rear dampers']},
{id:'whl',t:'Wheels',f:[N('wu','Durability','game value'),FR('ww','Width','mm'),FR('wp','Profile','mm'),SFR('po','Profile option',['None','Racing','Stretch']),SFR('pf','Profile offset',['-10','-5','0','+5','+10'],{show:pro}),FR('rd','Rim diameter','in'),FR('wg','Grip','%'),FR('wo','Wheel offset','cm',{neg:1}),FR('tpr','Tire pressure','bar'),S('tt','Tire type',['Street','Street+','Sport','Sport+','Racing','Racing+'])],
 p:['Tires','Spacers front','Spacers rear']}
];
const partF=p=>typeof p==='string'?{k:'p:'+p,l:p,t:'s',o:T}:{k:'p:'+p[0],l:p[0],t:'s',o:p[1]};

const REG={};
SEC.forEach(s=>{
 s.f.forEach(f=>{
  if(f.t==='n')REG[f.k]={t:'n'};
  else if(f.t==='fr'){REG[f.k+'F']={t:'n'};REG[f.k+'R']={t:'n'}}
  else if(f.t==='s')REG[f.k]={t:'s',o:f.o};
  else if(f.t==='sfr'){REG[f.k+'F']={t:'s',o:f.o};REG[f.k+'R']={t:'s',o:f.o}}
  else if(f.t==='x')REG[f.k]={t:'x'};
  else if(f.t==='g')for(let i=1;i<=10;i++)REG['g'+i]={t:'n'};
 });
 (s.p||[]).forEach(p=>{const f=partF(p);REG[f.k]={t:'s',o:f.o}});
});

const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

// ---- inputs ----
// Negative-capable fields use inputmode=text with a pattern so phones show a keypad with "-"
const numIn=(k,v,neg)=>neg
 ?`<input type=text inputmode=decimal pattern="-?[0-9]*[.]?[0-9]*" data-k="${k}" data-neg=1 value="${E(v??'')}" placeholder="—">`
 :`<input type=number step=any inputmode=decimal min=0 data-k="${k}" value="${E(v??'')}" placeholder="—">`;
const selIn=(k,o,v)=>`<select data-k="${k}">${o.map(x=>`<option${x===(v??o[0])?' selected':''}>${E(x)}</option>`).join('')}</select>`;

function fld(f,d){
 if(f.show&&!f.show(d))return'';
 const u=f.u?`<span class=unit>${E(f.u)}</span>`:'';
 let c='';
 if(f.t==='n')c=numIn(f.k,d[f.k],f.neg)+u;
 else if(f.t==='fr'){
  const fOn=f.front?f.front(d):true,rOn=f.rear?f.rear(d):true;
  c=(fOn?`<span>F</span>${numIn(f.k+'F',d[f.k+'F'],f.neg)}`:'')+(rOn?`<span>R</span>${numIn(f.k+'R',d[f.k+'R'],f.neg)}`:'');
  if(!c)return'';
  c+=u;
 }
 else if(f.t==='s')c=selIn(f.k,f.o,d[f.k]);
 else if(f.t==='sfr')c=`<span>F</span>${selIn(f.k+'F',f.o,d[f.k+'F'])}<span>R</span>${selIn(f.k+'R',f.o,d[f.k+'R'])}`;
 else if(f.t==='x')c=`<input type=text data-k="${f.k}" data-txt=1 maxlength=60 value="${E(d[f.k]||'')}">`;
 else if(f.t==='g'){const n=Math.min(10,Math.max(0,d.ng|0));c=n?Array.from({length:n},(_,i)=>`<span>${i+1}</span>${numIn('g'+(i+1),d['g'+(i+1)])}`).join(''):'<small>Set number of gears first</small>'}
 return`<div class=row><label>${E(f.l)}</label><div class=in>${c}</div></div>`;
}
function partRow(p,d){const f=partF(p);const v=d[f.k]||'Stock';const col=f.o===T?TC[Math.max(0,T.indexOf(v))]:'transparent';
 return`<div class=row style="border-left-color:${col}"><label>${E(f.l)}</label><div class=in>${selIn(f.k,f.o,v)}</div></div>`}

// ---- counts for section badges ----
function filled(s,d){
 let n=0,t=0;
 s.f.forEach(f=>{if(f.show&&!f.show(d))return;
  if(f.t==='n'){t++;if(d[f.k]!=null)n++}
  else if(f.t==='fr'){t+=2;if(d[f.k+'F']!=null)n++;if(d[f.k+'R']!=null)n++}
  else if(f.t==='x'){t++;if(d[f.k])n++}
  else if(f.t==='s'){t++;if(d[f.k]!=null)n++}
  else if(f.t==='g'){const k=Math.min(10,d.ng|0);t+=k;for(let i=1;i<=k;i++)if(d['g'+i]!=null)n++}
 });
 (s.p||[]).forEach(p=>{t++;if(d[partF(p).k])n++});
 return{n,t};
}

// ---- import validation ----
function clean(t){
 if(!t||typeof t!=='object'||!t.d||typeof t.d!=='object'||Array.isArray(t.d))return null;
 const d={};
 for(const k of Object.keys(t.d)){
  const r=REG[k],v=t.d[k];if(!r)continue;
  if(r.t==='n'&&typeof v==='number'&&isFinite(v))d[k]=v;
  else if(r.t==='s'&&r.o.includes(v))d[k]=v;
  else if(r.t==='x'&&typeof v==='string')d[k]=v.slice(0,60);
 }
 return{id:uid(),name:String(t.name||'Imported tune').slice(0,80),car:String(t.car||'').slice(0,80),d};
}
const enc=o=>btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))))};
function parse(s){
 s=String(s).trim();const i=s.indexOf('#t=');if(i>=0)s=s.slice(i+3);
 let o;try{o=s[0]==='{'||s[0]==='['?JSON.parse(s):dec(s)}catch(e){return[]}
 const a=Array.isArray(o)?o:o&&Array.isArray(o.tunes)?o.tunes:[o];
 return a.map(clean).filter(Boolean);
}
const strip=t=>({v:1,name:t.name,car:t.car,d:t.d});

// ---- numbers for charts/compare ----
const num=v=>typeof v==='number'&&isFinite(v);
function flat(t){
 const m=new Map();
 SEC.forEach(s=>s.f.forEach(f=>{
  if(f.show&&!f.show(t.d))return;
  const L=s.t+' · '+f.l;
  if(f.t==='n')m.set(L,{u:f.u||'',v:t.d[f.k]});
  else if(f.t==='fr'){m.set(L+' F',{u:f.u||'',v:t.d[f.k+'F']});m.set(L+' R',{u:f.u||'',v:t.d[f.k+'R']})}
  else if(f.t==='g')for(let i=1;i<=10;i++)if(num(t.d['g'+i]))m.set('Gear '+i,{u:'ratio',v:t.d['g'+i]});
 }));
 return m;
}
// Grouped comparison: for each metric present in either tune, both values (null if missing)
function compareRows(a,b){
 const fa=flat(a),fb=flat(b),keys=new Set([...fa.keys(),...fb.keys()]),rows=[];
 keys.forEach(k=>{const x=fa.get(k),y=fb.get(k);const va=x&&num(x.v)?x.v:null,vb=y&&num(y.v)?y.v:null;
  if(va==null&&vb==null)return;rows.push({label:k,unit:(x||y).u||'value',a:va,b:vb})});
 return rows;
}

// ---- state ----
const $=id=>document.getElementById(id),app=$('app'),tabs=$('tabs');
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}}};
let DB;try{DB=JSON.parse(ls.get('cxt'))||{tunes:[]}}catch(e){DB={tunes:[]}}
if(!DB||!Array.isArray(DB.tunes))DB={tunes:[]};
let cur=null,view='list',charts=[],open=new Set(['stats']),q='',cA='',cB='',mode='stats',cmpBusy=false,undo=null;
let th=ls.get('cxth')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function applyTheme(){document.documentElement.dataset.theme=th;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=th==='dark'?'#000000':'#f2f2f7'}
let saveT;
function save(){if(!ls.set('cxt',JSON.stringify(DB))){toast('Could not save: storage blocked or full');return false}
 const s=$('saved');if(s){s.textContent='Saved';clearTimeout(save.h);save.h=setTimeout(()=>{const x=$('saved');if(x)x.textContent=''},1200)}return true}
function toast(m,action){const t=$('toast');t.innerHTML=E(m)+(action?` <button class=ghost data-a=${action.a} style="min-height:auto;padding:0 0 0 8px">${action.l}</button>`:'');t.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',action?5000:2200)}
const bar=(l,t,r='')=>`<header>${l}<h1 id=ttl>${E(t)}</h1><span id=saved class=saved></span>${r}<button class=ghost data-a=theme title="Toggle dark/light">${th==='dark'?'Light':'Dark'}</button></header>`;
function modal(h){let m=$('md');if(!m){m=document.createElement('div');m.id='md';document.body.append(m)}m.innerHTML=`<div class=sheet>${h}<div class=acts><button data-a=close>Done</button></div></div>`}
const find=id=>DB.tunes.find(t=>t.id===id);

function tuneLine(t){return [t.d.hp?t.d.hp+' hp':'',t.d.wt?t.d.wt+' kg':'',t.d.dr||''].filter(Boolean).join(' · ')}
const lst=()=>{
 const ql=q.toLowerCase();
 const r=DB.tunes.filter(t=>{if(!ql)return true;const parts=[t.name,t.car,...Object.keys(t.d).filter(k=>k.startsWith('p:')).map(k=>t.d[k]),t.d.en||'',t.d.tn||''];return parts.join(' ').toLowerCase().includes(ql)||Object.keys(t.d).some(k=>k.startsWith('p:')&&k.slice(2).toLowerCase().includes(ql)&&t.d[k]!=='Stock')});
 return r.length?r.map(t=>`<div class=card><div><b>${E(t.name)}</b><br><small>${E(t.car)}${tuneLine(t)?' · '+E(tuneLine(t)):''}</small></div><div class=acts><button class=p data-a=open data-id=${t.id}>Open</button><button data-a=share data-id=${t.id}>Share</button><button data-a=dup data-id=${t.id}>Duplicate</button><button class=danger data-a=del data-id=${t.id}>Delete</button></div></div>`).join(''):'<p class=mu>No tunes yet. Tap "New tune" or "Import".</p>'};

function renderList(){
 view='list';destroyCharts();tabs.innerHTML='';
 app.innerHTML=bar('','CarX Tune Database')+`<div class=wrap><div class=acts><button class=p data-a=new>New tune</button><button data-a=import>Import</button><button data-a=backup>Backup all</button><button data-a=compare>Compare</button></div><input id=q type=search placeholder="Search tunes or parts" value="${E(q)}" style="width:100%;margin-bottom:12px"><div id=lst>${lst()}</div></div>`;
}
function summaryHtml(d){
 const s=[['Power',d.hp?d.hp+' hp':'—'],['Weight',d.wt?d.wt+' kg':'—'],['Drive',d.dr||'—'],['Engine',d.en||'—']];
 return `<div class=summary id=sum>${s.map(x=>`<div class=stat><small>${x[0]}</small><b>${E(x[1])}</b></div>`).join('')}</div>`;
}
function renderEdit(){
 view='edit';destroyCharts();
 let h=bar('<button class=ghost data-a=back>‹ Tunes</button>',cur.name||'Tune');
 h+=`<div class=wrap><div class=card><label class=lbl>Tune name</label><input class=field data-r=name value="${E(cur.name)}"><label class=lbl>Car</label><input class=field data-r=car value="${E(cur.car)}"><div id=sumbox>${summaryHtml(cur.d)}</div><div class=seg id=seg><button data-a=mode data-m=stats class="${mode==='stats'?'on':''}">Inputs</button><button data-a=mode data-m=charts class="${mode==='charts'?'on':''}">Charts</button></div><div class=acts><button data-a=share data-id=${cur.id}>Share</button></div></div>`;
 SEC.forEach(s=>{const b=filled(s,cur.d);
  h+=`<details data-s=${s.id} id=sec-${s.id}${open.has(s.id)?' open':''}><summary>${s.t}<span class=badge>${b.n}/${b.t}</span></summary><div class=sec><div class=inputs>${s.f.map(f=>fld(f,cur.d)).join('')}${s.p?'<h3>Parts</h3>'+s.p.map(p=>partRow(p,cur.d)).join(''):''}</div><div class=cg id=c-${s.id}></div></div></details>`;
 });
 app.innerHTML=h+'</div>';
 tabs.innerHTML=SEC.map(s=>`<button data-a=jump data-s=${s.id}>${s.t.replace('Car overall stats','Stats').replace('Suspension','Susp.')}</button>`).join('');
 applyMode();drawCharts();
}
function applyMode(){
 document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
 document.querySelectorAll('.inputs').forEach(i=>i.style.display=mode==='stats'?'':'none');
 document.querySelectorAll('.cg').forEach(c=>c.style.display=mode==='charts'?'':'');
 document.querySelectorAll('.cg').forEach(c=>c.style.display=(mode==='charts'||window.innerWidth>=900)?'':'none');
 document.querySelectorAll('.inputs').forEach(i=>i.style.display=(mode==='stats'||window.innerWidth>=900)?'':'none');
}
function renderCmp(){
 view='cmp';destroyCharts();tabs.innerHTML='';
 const o=DB.tunes.map(t=>`<option value=${t.id}>${E(t.name)}</option>`).join('');
 app.innerHTML=bar('<button class=ghost data-a=back>‹ Tunes</button>','Compare')+`<div class=wrap>${DB.tunes.length<2?'<p class=mu>You need at least two tunes to compare.</p>':`<div class="card"><div class=acts><select data-c=a aria-label="Tune A">${o}</select><select data-c=b aria-label="Tune B">${o}</select></div><div class=mu style="font-size:13px"><span style="color:${C.a}">■</span> Tune A &nbsp; <span style="color:${C.b}">■</span> Tune B</div></div><div id=cb></div>`}</div>`;
 if(DB.tunes.length>1){
  if(!find(cA))cA=DB.tunes[0].id;if(!find(cB)||cB===cA)cB=DB.tunes.find(t=>t.id!==cA).id;
  document.querySelector('[data-c=a]').value=cA;document.querySelector('[data-c=b]').value=cB;drawCharts();
 }
}

// ---- charts ----
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[]}
function box(parent,cls){const w=document.createElement('div');w.className='cc '+(cls||'');const cv=document.createElement('canvas');w.append(cv);parent.append(w);return cv}
function opts(title){const cs=getComputedStyle(document.documentElement);const tx=cs.getPropertyValue('--tx').trim(),bd=cs.getPropertyValue('--bd').trim();
 Chart.defaults.color=tx;Chart.defaults.borderColor=bd;Chart.defaults.font.family='-apple-system,system-ui,sans-serif';
 return{responsive:true,maintainAspectRatio:false,animation:{duration:window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:400},plugins:{title:{display:true,text:title,color:tx,font:{size:13,weight:'600'}},legend:{labels:{color:tx,boxWidth:10}}}}}

function chartTorque(parent,d){
 const pts=[['Low',d.tl],['Medium',d.tm],['High',d.th]];if(!pts.some(p=>num(p[1])))return;
 const vals=pts.map(p=>num(p[1])?p[1]:null);const mx=Math.max(...vals.filter(num));const pk=vals.indexOf(mx);
 const cv=box(parent,'');cv.parentElement.style.height='220px';
 charts.push(new Chart(cv,{type:'line',data:{labels:pts.map(p=>p[0]),datasets:[{label:'Torque (Nm)',data:vals,borderColor:C.a,backgroundColor:C.a+'22',fill:true,tension:.35,spanGaps:false,pointRadius:vals.map((_,i)=>i===pk?8:4),pointBackgroundColor:vals.map((_,i)=>i===pk?C.gold:C.a)}]},
  options:{...opts('Torque curve (peak in gold)'),scales:{y:{title:{display:true,text:'Nm'}}}}}));
}
function chartGears(parent,d){
 const n=Math.min(10,Math.max(0,d.ng|0));const v=Array.from({length:n},(_,i)=>d['g'+(i+1)]);if(!v.some(num))return;
 const labels=v.map((_,i)=>'G'+(i+1));
 const gaps=v.slice(1).map((x,i)=>num(x)&&num(v[i])?v[i]-x:null);
 const valid=gaps.filter(num).map(Math.abs);const avg=valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:0;
 const cv=box(parent,'');cv.parentElement.style.height='220px';
 const pc=v.map((_,i)=>i===0?C.a:(num(gaps[i-1])&&Math.abs(gaps[i-1])>avg*1.5?C.bad:C.a));
 charts.push(new Chart(cv,{type:'line',data:{labels,datasets:[{label:'Ratio',data:v,borderColor:C.a,tension:0,spanGaps:true,pointRadius:6,pointBackgroundColor:pc}]},
  options:{...opts('Gear ratios (red = wide gap)'),scales:{y:{title:{display:true,text:'Ratio'}}}}}));
}
function chartPair(parent,title,rows){
 const valid=rows.filter(r=>num(r.f)||num(r.r));if(!valid.length)return;
 const cv=box(parent,'');cv.parentElement.style.height=Math.max(180,valid.length*40+90)+'px';
 charts.push(new Chart(cv,{type:'bar',data:{labels:valid.map(r=>r.l),datasets:[
  {label:'Front',data:valid.map(r=>num(r.f)?r.f:null),backgroundColor:C.front,borderRadius:4},
  {label:'Rear',data:valid.map(r=>num(r.r)?r.r:null),backgroundColor:C.rear,borderRadius:4}]},
  options:{...opts(title),indexAxis:'y',scales:{x:{grid:{color:ctx=>ctx.tick.value===0?'#888':undefined},title:{display:true,text:'value (0 = centre)'}}}}}));
}
// Radar only in Car overall stats: weight, power, top speed, acceleration
function chartRadar(parent,d){
 const axes=[['Weight',d.wt],['Power',d.hp],['Top speed',d.top],['Acceleration',d.acc]];
 if(!axes.some(a=>num(a[1])))return;
 const vals=axes.map(a=>num(a[1])?a[1]:0);const mx=Math.max(...vals.map(Math.abs),1);
 const cv=box(parent,'');cv.parentElement.style.height='280px';
 charts.push(new Chart(cv,{type:'radar',data:{labels:axes.map(a=>a[0]),datasets:[{label:'This tune (relative to its own max)',data:vals.map(v=>Math.round(Math.abs(v)/mx*100)),borderColor:C.a,backgroundColor:C.a+'33',pointBackgroundColor:C.a}]},
  options:{...opts('Car profile'),scales:{r:{beginAtZero:true,max:100,ticks:{display:false},grid:{color:'#8883'},angleLines:{color:'#8883'}}}}}));
}
// Comparison: grouped bars, Tune A vs Tune B per metric, missing values left empty
function chartCompare(parent,a,b){
 const rows=compareRows(a,b);
 if(!rows.length){parent.innerHTML='<div class=card><p class=mu>Nothing to compare yet. Fill in values for either tune.</p></div>';return}
 const groups={};rows.forEach(r=>{(groups[r.unit]=groups[r.unit]||[]).push(r)});
 for(const u in groups){
  const g=groups[u];const cv=box(parent,'');cv.parentElement.style.height=Math.max(200,g.length*44+100)+'px';
  charts.push(new Chart(cv,{type:'bar',data:{labels:g.map(r=>r.label),datasets:[
   {label:a.name,data:g.map(r=>r.a),backgroundColor:C.a,borderRadius:4},
   {label:b.name,data:g.map(r=>r.b),backgroundColor:C.b,borderRadius:4}]},
   options:{...opts(`Comparison (${u})`),indexAxis:'y',scales:{x:{title:{display:true,text:u}}}}}));
 }
}

function drawCharts(){
 destroyCharts();
 if(!window.Chart){document.querySelectorAll('.cg,#cb').forEach(e=>e.innerHTML='<div class=card><p class=mu>Charts need Chart.js. Open the app once while online.</p></div>');return}
 if(view==='edit'){
  const d=cur.d;
  const s=$('c-stats');if(s)chartRadar(s,d);
  const e=$('c-eng');if(e)chartTorque(e,d);
  const dr=$('c-drive');if(dr)chartGears(dr,d);
  const su=$('c-susp');if(su)chartPair(su,'Suspension balance (front vs rear)',[
    {l:'Spring height (mm)',f:d.shF,r:d.shR},{l:'Spring stiffness (kNm)',f:d.ssF,r:d.ssR},{l:'Stabilizer (kNm)',f:d.stF,r:d.stR},{l:'Camber (deg)',f:d.cbF,r:d.cbR},{l:'Damper slow bump',f:d.d1F,r:d.d1R},{l:'Damper fast bump',f:d.d2F,r:d.d2R},{l:'Damper slow rebound',f:d.d3F,r:d.d3R},{l:'Damper fast rebound',f:d.d4F,r:d.d4R}]);
  const wh=$('c-whl');if(wh)chartPair(wh,'Wheel balance (front vs rear)',[
    {l:'Width (mm)',f:d.wwF,r:d.wwR},{l:'Profile (mm)',f:d.wpF,r:d.wpR},{l:'Rim (in)',f:d.rdF,r:d.rdR},{l:'Grip (%)',f:d.wgF,r:d.wgR},{l:'Wheel offset (cm)',f:d.woF,r:d.woR},{l:'Tire pressure (bar)',f:d.tprF,r:d.tprR}]);
  const bd=$('c-body');if(bd)chartPair(bd,'Downforce (front vs rear, kg)',[{l:'Downforce (kg)',f:d.dfF,r:d.dfR}]);
 } else if(view==='cmp'){
  const a=find(cA),b=find(cB),b2=$('cb');if(a&&b&&b2){b2.innerHTML='';chartCompare(b2,a,b)}
 }
}

// ---- events ----
function setv(el){
 const k=el.dataset.k;const v=el.value;
 if(el.dataset.neg){ // allow "-", "-." etc while typing
  if(v===''||v==='-'||v==='.'||v==='-.'){delete cur.d[k];}
  else if(isFinite(+v)){cur.d[k]=+v}
  else return;
 } else if(el.type==='number'){if(v==='')delete cur.d[k];else if(isFinite(+v))cur.d[k]=+v}
 else if(v===''){delete cur.d[k]}
 else cur.d[k]=v;
 save();
}
function refreshSummary(){const b=$('sumbox');if(b)b.innerHTML=summaryHtml(cur.d)}
function addTunes(a){
 if(!a.length)return toast('No valid tune found');
 DB.tunes.unshift(...a);save();
 const m=$('md');if(m)m.remove();
 toast(a.length+' tune(s) imported');
 if(location.hash.startsWith('#t='))history.replaceState(null,'',location.pathname);
 renderList();
}
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='q'){q=el.value;$('lst').innerHTML=lst();return}
 if(el.dataset.r){
  cur[el.dataset.r]=el.value;save();
  if(el.dataset.r==='name'){const h=$('ttl');if(h)h.textContent=el.value||'Tune'}
  return}
 if(el.dataset.txt){cur.d[el.dataset.k]=el.value;save();return}
 if(el.dataset.k){setv(el);refreshSummary()}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.c){if(el.dataset.c==='a')cA=el.value;else cB=el.value;drawCharts();return}
 if(el.id==='fi'){el.files[0]&&el.files[0].text().then(t=>addTunes(parse(t)));return}
 if(el.dataset.r||el.dataset.txt)return;
 if(!el.dataset.k)return;
 setv(el);refreshSummary();
 if(el.tagName==='SELECT'||el.dataset.int){const sc=scrollY;renderEdit();scrollTo(0,sc)}
 else if(!el.dataset.neg||true){drawCharts()}
});
document.addEventListener('focusout',e=>{
 const el=e.target;
 if(el.dataset&&el.dataset.neg&&(el.value==='-'||el.value==='.'||el.value==='-.')){el.value='';setv(el);refreshSummary()}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.k){const all=[...document.querySelectorAll('[data-k]')];const i=all.indexOf(e.target);if(i>-1&&all[i+1]){e.preventDefault();all[i+1].focus()}}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'&&view==='list'){e.preventDefault();$('app').querySelector('[data-a=new]')?.click()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'&&view==='list'){e.preventDefault();$('q')?.focus()}
});
document.addEventListener('toggle',e=>{const s=e.target.dataset&&e.target.dataset.s;if(s){e.target.open?open.add(s):open.delete(s)}},true);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,id=b.dataset.id;
 if(a==='theme'){th=th==='dark'?'light':'dark';ls.set('cxth',th);applyTheme();view==='edit'?renderEdit():view==='cmp'?renderCmp():renderList()}
 else if(a==='new'){cur={id:uid(),name:'New tune',car:'',d:{}};DB.tunes.unshift(cur);save();renderEdit();const n=document.querySelector('[data-r=name]');if(n){n.focus();n.select()}}
 else if(a==='open'){cur=find(id);renderEdit()}
 else if(a==='back'){cur=null;renderList()}
 else if(a==='mode'){mode=b.dataset.m;applyMode()}
 else if(a==='jump'){const det=$('sec-'+b.dataset.s);if(det){det.open=true;open.add(b.dataset.s);det.scrollIntoView({behavior:'smooth',block:'start'})}}
 else if(a==='dup'){const t=find(id),c=JSON.parse(JSON.stringify(t));c.id=uid();c.name+=' (copy)';DB.tunes.unshift(c);save();renderList()}
 else if(a==='del'){const t=find(id);if(!confirm(`Delete "${t.name}"? This cannot be undone.`))return;
  const idx=DB.tunes.indexOf(t);DB.tunes.splice(idx,1);save();
  undo={t,idx};toast('Tune deleted',{a:'undo',l:'Undo'});renderList()}
 else if(a==='undo'){if(undo){DB.tunes.splice(Math.min(undo.idx,DB.tunes.length),0,undo.t);save();undo=null;toast('Restored');renderList()}}
 else if(a==='compare')renderCmp();
 else if(a==='close'){const m=$('md');if(m)m.remove()}
 else if(a==='share'){
  const t=find(id),c=enc(strip(t)),l=location.href.split('#')[0]+'#t='+c;
  modal(`<b>Share "${E(t.name)}"</b><p class=mu>Link (tap to import):</p><textarea id=sl readonly>${E(l)}</textarea><div class=acts><button data-a=copy data-id=sl>Copy link</button></div><p class=mu>Code (paste into Import):</p><textarea id=sc readonly>${E(c)}</textarea><div class=acts><button data-a=copy data-id=sc>Copy code</button><button data-a=file data-id=${t.id}>Download .json</button></div>`);
 }
 else if(a==='copy'){const el=$(id);el.select();(navigator.clipboard?navigator.clipboard.writeText(el.value):Promise.reject()).catch(()=>document.execCommand('copy'));toast('Copied')}
 else if(a==='file'||a==='backup'){
  const o=a==='file'?strip(find(id)):{v:1,tunes:DB.tunes.map(strip)};
  const n=a==='file'?find(id).name.replace(/\W+/g,'-'):'carx-backup-'+new Date().toISOString().slice(0,10);
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));l.download=n+'.json';document.body.append(l);l.click();l.remove();
 }
 else if(a==='import')modal('<b>Import</b><p class=mu>Paste a tune code or link:</p><textarea id=ic></textarea><div class=acts><button class=p data-a=doimport>Import</button></div><p class=mu>Or choose a .json tune or backup file:</p><input type=file id=fi accept=".json,.txt,application/json">');
 else if(a==='doimport')addTunes(parse($('ic').value));
});
applyTheme();renderList();
if(location.hash.startsWith('#t=')){modal('<b>Import</b><p class=mu>A shared tune was opened:</p><textarea id=ic>'+E(location.hash)+'</textarea><div class=acts><button class=p data-a=doimport>Import it</button></div>')}
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
